input {
  beats {
    port => 5044
  }
}

filter {
  # 按 PRD 2.1.4，日志检索需支持时间范围、服务器、关键词多维过滤
  mutate {
    add_field => { "[@metadata][target_index]" => "opsai-logs-%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }
}
