; Ansible 控制节点示例（PRD 3.7：SSH 方式执行）
; 注意：ansible-core 官方不支持 Windows 作为控制节点，
; 请在 Linux 控制机 / WSL 中运行，并用 ansible_user 指向有最小 sudo 权限的账号。
; 100 台以上并发需调大 ansible.cfg 中的 forks。

[servers]
; 0931.example.internal ansible_host=10.0.0.31 ansible_user=ops

[servers:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_python_interpreter=/usr/bin/python3
